name: Cask CI

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tap local checkout
        run: brew tap albertstarfield/gnatstudio "$GITHUB_WORKSPACE"
      - name: Trust local tap
        run: brew trust albertstarfield/gnatstudio
      - name: Update Homebrew
        run: brew update
      - name: Audit formula
        run: brew audit --strict --online albertstarfield/gnatstudio/gnatstudio
      - name: Audit cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew audit --strict --online --cask albertstarfield/gnatstudio/gnatstudio
      - name: Check style
        run: brew style albertstarfield/gnatstudio
